<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>🛡️ Middleware FastAPI</title>
    <link rel="icon" type="image/png" href="{{ favicon_url }}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ static_url }}/css/styles.css" />
    <link rel="stylesheet" href="{{ static_url }}/json-viewer/jquery.json-viewer.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ static_url }}/json-viewer/jquery.json-viewer.js"></script>
    <script src="{{ static_url }}/js/app.js" defer></script>

    <style>
        body{
            
        }
      .theme-dark {
        background-color: #121212;
        color: #ffffff;
      }
      .theme-dark .table {
        color: #ffffff;
      }
      .theme-dark pre {
        background-color: #1e1e1e;
        color: #d4d4d4;
      }
      .theme-toggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1055;
      }
    </style>
  </head>
  <body class="p-4" id="body">
    <div class="container">
      <h1 class="mb-4">🛡️ Middleware FastAPI ({{ middlewares | length }})</h1>

      <table class="table table-bordered table-hover table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th style="width: 25%">Класс</th>
            <th style="width: 25%">Модуль</th>
            <th style="width: 10%">Тип</th>
            <th style="width: 40%">Опции</th>
          </tr>
        </thead>
        <tbody>
          {% for mw in middlewares %}
          <tr>
            <td><code>{{ mw.class.name }}</code></td>
            <td><code>{{ mw.class.module }}</code></td>
            <td><code>{{ mw.class.type }}</code></td>
            <td style="max-width: 400px; overflow-x: auto;">
              {% if mw.options %}
                <div id="json-renderer-{{ loop.index0 }}"></div>
                <script>
                  $(function () {
                    const data = {{ mw.options | tojson | safe }};
                    $("#json-renderer-{{ loop.index0 }}").jsonViewer(data, {
                      collapsed: false,
                      rootCollapsable: true,
                      withQuotes: true,
                      withLinks: false
                    });
                  });
                </script>
              {% else %}
                <span class="text-muted">—</span>
              {% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <button class="btn btn-secondary theme-toggle" onclick="toggleTheme()">
      🌓
    </button>

    <script>
      console.log("Middleware dump", {{ middlewares | tojson(indent=2) | safe }});

      function toggleTheme() {
        const body = document.getElementById("body");
        body.classList.toggle("theme-dark");
        localStorage.setItem("theme", body.classList.contains("theme-dark") ? "dark" : "light");
      }

      window.onload = () => {
        if (localStorage.getItem("theme") === "dark") {
          document.getElementById("body").classList.add("theme-dark");
        }
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
