<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traceroute Viewer - {{ host }}</title>
  <link rel="icon" type="image/png" href="{{ favicon_url }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      padding: 2rem;
      background-color: #f8fafc;
      color: #1f2937;
    }
    .container {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    .timeout {
      color: #ef4444;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Traceroute до {{ host }}</h1>

    <div id="status" class="mb-3 text-muted">Запуск трассировки...</div>

    <table class="table table-striped" id="hops-table" style="display: none;">
<thead>
  <tr>
    <th>Hop</th>
    <th>Address</th>
    <th>Delay</th>
    <th>MPLS</th>
    <th>Info</th>
  </tr>
</thead>
      <tbody></tbody>
    </table>

    <form method="get" class="mt-4">
      <div class="input-group">
        <input type="text" name="host" class="form-control" placeholder="example.com" value="{{ host }}" required />
        <button class="btn btn-primary" type="submit">Обновить</button>
      </div>
    </form>
  </div>

<script>
  const host = "{{ host }}";
  const status = document.getElementById("status");
  const table = document.getElementById("hops-table");
  const tbody = table.querySelector("tbody");

  fetch(`/network/traceroute?host=${encodeURIComponent(host)}`)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        status.innerHTML = `<span class="text-danger">Ошибка: ${data.error}</span>`;
        return;
      }

      status.textContent = `Маршрут до ${data.host}, найдено ${data.hops.length} hop(ов):`;
      table.style.display = "";

      data.hops.forEach(hop => {
        const row = document.createElement("tr");

        const address = hop.address === "*" ? '<span class="timeout">Request timed out</span>' : hop.address;
        const delay = hop.delay?.toLowerCase().includes("timeout") ? '<span class="timeout">Timeout</span>' : hop.delay;
        const mpls = hop.mpls ? hop.mpls : '';
        const info = hop.info ? hop.info : '';

        row.innerHTML = `
          <td>${hop.hop}</td>
          <td>${address}</td>
          <td>${delay}</td>
          <td>${mpls}</td>
          <td>${info}</td>
        `;
        tbody.appendChild(row);
      });
    })
    .catch(err => {
      status.innerHTML = `<span class="text-danger">Ошибка запроса: ${err.message}</span>`;
    });
</script>

</body>
</html>
