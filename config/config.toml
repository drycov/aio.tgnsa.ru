# config.toml для TG NMS

use_redis = false
use_fs = true
use_mongodb = false
use_firebase = false
use_cache = false

[app]
name = "TG NMS"
description = "Модульная система управления сетевой инфраструктурой"
version = "0.1.0"

[app.default]
default_user = "root"
default_password = "root"
default_email = "admin@example.com"
default_user_fullname = "Admin"

[db]
echo = false
engine = "sqlite"  # Доступные движки: sqlite, postgres, mysql

[db.postgres]
host = "localhost"
port = 5432
name = "postgres"

[db.sqlite]
name = "app.db"

[db.mysql]
host = "localhost"
port = 3306
name = "test"

[bot]
admins = [123456789]
superusers = [123456789]
rate_limit = 1.0
role_access = { admin = ["*"] }

[security]
tfa_enable = false
jwt_algorithm = "HS256"
access_token_expire_minutes = 60
access_token_expire_seconds = 3600
use_special_char = false
min_length = 8

[redis]
host = "localhost"
port = 6379
db = 0
password = ""
use_tls = false

[cache]
cache_type = "None"

[misc]
timezone = "UTC"
max_payload_size_mb = 10
excluded_substrings = ""

[email]
smtp_host = "smtp.example.com"
smtp_port = 587
smtp_user = "admin@example.com"
smtp_password = "yourpassword"
from_email = "admin@example.com"
enable_tls = true
support_email = "support@example.com"
admin_email = "admin@example.com"

[api]
api_host = "127.0.0.1"
api_port = 8000
api_workers = 1

[network]
ping_count = 4
ping_interval = 2
ping_timeout = 10
snmp_ro = []
snmp_rw = []

[tfa]
issuer = "TG NMS"
digits = 6
period = 30
